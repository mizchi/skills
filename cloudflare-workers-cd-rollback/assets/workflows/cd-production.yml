name: CD production

# Auto-deploy push-to-release-branch to production. To ship the
# current state of main, fast-forward `release` from `main`:
#
#   git push origin main:release
#
# Then this workflow fires the same deploy + smoke + auto-rollback
# chain as cd-staging, but against production. The release branch is
# the source of truth for what's running in production.
#
# To roll back: revert the release branch to a prior commit and push,
# or run deploy.yml via workflow_dispatch with environment=production.

on:
  push:
    branches:
      - release
    paths:
      - "src/**"
      - "db/**"
      - "scripts/**"
      - ".github/workflows/cd-production.yml"
      - ".github/workflows/deploy.yml"
      - "cloudflare.config.ts"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "moon.mod"
      - "moon.mod.json"

permissions:
  contents: read

jobs:
  precheck:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable production CD."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: precheck
    if: needs.precheck.outputs.ready == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      message: "cd-production ${{ github.sha }}"
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      CF_ACCESS_CLIENT_ID_STAGING: ${{ secrets.CF_ACCESS_CLIENT_ID_STAGING }}
      CF_ACCESS_CLIENT_SECRET_STAGING: ${{ secrets.CF_ACCESS_CLIENT_SECRET_STAGING }}
