name: deploy

# Reusable deploy workflow. Captures the currently-deployed traffic allocation
# before deploying, applies D1 migrations, builds + deploys, runs smoke,
# auto-rolls-back on smoke failure, and reports a summary.
#
# Called from cd-staging.yml (push to main → staging) and
# cd-production.yml (push to release → production). Also available via
# workflow_dispatch for manual hot fixes.
#
# .env.cloudflare is the single source of truth for Cloudflare creds.
# It's committed encrypted via dotenvx; the only repo secret needed is
# DOTENV_PRIVATE_KEY_CLOUDFLARE. Rotating one key rotates every cred.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: "production"
        options:
          - production
          - staging
      message:
        description: "Message attached to the new cf Worker version"
        required: false
        default: ""
      skip_smoke:
        description: "Skip post-deploy smoke (emergency hot fix only)"
        required: true
        type: boolean
        default: false
      skip_rollback:
        description: "Don't auto-rollback on smoke failure"
        required: true
        type: boolean
        default: false
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      message:
        required: false
        type: string
        default: ""
      skip_smoke:
        required: false
        type: boolean
        default: false
      skip_rollback:
        required: false
        type: boolean
        default: false
    secrets:
      DOTENV_PRIVATE_KEY_CLOUDFLARE:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOTENV_PRIVATE_KEY_CLOUDFLARE: ${{ secrets.DOTENV_PRIVATE_KEY_CLOUDFLARE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Get pnpm store path
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Cache MoonBit packages
        uses: actions/cache@v6
        with:
          path: ~/.moon
          key: ${{ runner.os }}-moon-${{ hashFiles('moon.mod', 'moon.mod.json') }}
          restore-keys: |
            ${{ runner.os }}-moon-

      - name: Update MoonBit package index
        run: moon update

      - name: Install MoonBit dependencies
        run: moon install

      - name: Resolve deployment target
        id: target
        env:
          TARGET_MODE: ${{ inputs.environment }}
          WORKER_PRODUCTION: ${{ vars.WORKER_NAME_PRODUCTION || 'cf-mbt-app' }}
          WORKER_STAGING: ${{ vars.WORKER_NAME_STAGING || 'cf-mbt-app-staging' }}
          DB_PRODUCTION: ${{ vars.D1_DATABASE_ID_PRODUCTION }}
          DB_STAGING: ${{ vars.D1_DATABASE_ID_STAGING }}
          WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN || 'YOUR-SUBDOMAIN' }}
        run: |
          set -euo pipefail
          case "$TARGET_MODE" in
            production) worker="$WORKER_PRODUCTION"; database_id="$DB_PRODUCTION" ;;
            staging) worker="$WORKER_STAGING"; database_id="$DB_STAGING" ;;
            *) echo "::error::environment must be production or staging"; exit 1 ;;
          esac
          test -n "$database_id" || { echo "::error::Set the mode-specific D1_DATABASE_ID repository variable"; exit 1; }
          echo "worker=$worker" >> "$GITHUB_OUTPUT"
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
          echo "smoke_base=https://$worker.$WORKERS_SUBDOMAIN.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Capture current traffic allocation (rollback target)
        id: pre_deploy
        env:
          TARGET_WORKER: ${{ steps.target.outputs.worker }}
        run: |
          set -uo pipefail
          # cf API output is JSON; keep progress/errors separate from stdout.
          set +e
          pnpm exec dotenvx run -f .env.cloudflare --quiet -- \
            pnpm exec cf workers deployments list --worker "$TARGET_WORKER" \
            > /tmp/deployments.json 2> /tmp/deployments.err
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            cat /tmp/deployments.err >&2
            if grep -Eq '10007|This Worker does not exist' /tmp/deployments.err; then
              echo '[]' > /tmp/previous-versions.json
            else
              echo "::error::cf deployments list failed (exit $rc)"
              exit "$rc"
            fi
          else
            # Latest deployment is FIRST. Preserve every version and percentage.
            node scripts/deployment-state.ts /tmp/deployments.json > /tmp/previous-versions.json
          fi
          echo "first_deploy=$(jq 'length == 0' /tmp/previous-versions.json)" >> "$GITHUB_OUTPUT"
          echo "versions=$(cat /tmp/previous-versions.json)" >> "$GITHUB_OUTPUT"

      - name: Apply D1 migrations
        env:
          DATABASE_ID: ${{ steps.target.outputs.database_id }}
        run: |
          set -euo pipefail
          # Resource APIs default to remote; IDs replace old database names.
          pnpm exec dotenvx run -f .env.cloudflare --quiet -- \
            pnpm exec cf d1 migrations apply "$DATABASE_ID" --dir db/migrations

      - name: Prepare MoonBit core and build Worker
        env:
          TARGET_MODE: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          pnpm run build:core
          pnpm exec cf workers types --mode "$TARGET_MODE"
          pnpm exec cf build --mode "$TARGET_MODE"
          node scripts/check-worker-bundle.ts .cloudflare/output/v0/workers/default/bundle
          pnpm exec cf deploy --prebuilt --mode "$TARGET_MODE" --dry-run

      - name: Deploy checked Build Output
        id: deploy
        env:
          TARGET_MODE: ${{ inputs.environment }}
          DEPLOY_MESSAGE: ${{ inputs.message }}
          TARGET_WORKER: ${{ steps.target.outputs.worker }}
        run: |
          set -euo pipefail
          short_sha=$(git rev-parse --short HEAD)
          msg="${DEPLOY_MESSAGE:-ci-deploy} ($short_sha)"
          pnpm exec dotenvx run -f .env.cloudflare --quiet -- \
            pnpm exec cf deploy --prebuilt --mode "$TARGET_MODE" --message "$msg"
          # Query API JSON rather than scraping cf deploy's human-readable output.
          pnpm exec dotenvx run -f .env.cloudflare --quiet -- \
            pnpm exec cf workers deployments list --worker "$TARGET_WORKER" > /tmp/new-deployments.json
          node scripts/deployment-state.ts /tmp/new-deployments.json > /tmp/new-versions.json
          new_version_id=$(jq -er 'if length == 1 and .[0].percentage == 100 then .[0].version_id else error("Expected one deployed version at 100 percent") end' /tmp/new-versions.json)
          echo "new_version_id=$new_version_id" >> "$GITHUB_OUTPUT"

      - name: Run post-deploy smoke
        id: smoke
        if: ${{ inputs.skip_smoke == false }}
        # continue-on-error so the rollback step gets a chance to react.
        continue-on-error: true
        env:
          SMOKE_BASE_URL: ${{ steps.target.outputs.smoke_base }}
        # Access creds (CF_ACCESS_CLIENT_ID/SECRET) come from
        # .env.cloudflare via dotenvx, with *_STAGING entries remapped
        # onto canonical names when targeting staging.
        run: |
          if [ "${{ inputs.environment }}" = "staging" ]; then
            access_id_var=CF_ACCESS_CLIENT_ID_STAGING
            access_secret_var=CF_ACCESS_CLIENT_SECRET_STAGING
          else
            access_id_var=CF_ACCESS_CLIENT_ID
            access_secret_var=CF_ACCESS_CLIENT_SECRET
          fi
          pnpm exec dotenvx run -f .env.cloudflare --quiet -- \
            bash -c "
              export CF_ACCESS_CLIENT_ID=\"\${$access_id_var:-}\"
              export CF_ACCESS_CLIENT_SECRET=\"\${$access_secret_var:-}\"
              pnpm run smoke
            "

      - name: Restore previous traffic on smoke failure
        id: rollback
        if: ${{ inputs.skip_smoke == false && steps.smoke.outcome == 'failure' && inputs.skip_rollback == false && steps.pre_deploy.outputs.first_deploy != 'true' }}
        env:
          TARGET_WORKER: ${{ steps.target.outputs.worker }}
        run: |
          set -euo pipefail
          pnpm exec dotenvx run -f .env.cloudflare --quiet -- \
            pnpm exec cf workers deployments create --worker "$TARGET_WORKER" \
              --strategy percentage --versions @/tmp/previous-versions.json
          echo "Restored previous traffic allocation for $TARGET_WORKER"

      - name: "Note: no rollback target on first deploy"
        if: ${{ inputs.skip_smoke == false && steps.smoke.outcome == 'failure' && steps.pre_deploy.outputs.first_deploy == 'true' }}
        run: |
          echo "::warning::Smoke failed on the first deploy for this env; no prior version exists to roll back to. Investigate the new version directly: ${{ steps.deploy.outputs.new_version_id }}"

      - name: Report deploy result
        if: ${{ always() }}
        env:
          PREVIOUS_TRAFFIC: ${{ steps.pre_deploy.outputs.versions }}
        run: |
          smoke_outcome="${{ steps.smoke.outcome }}"
          if [ "${{ inputs.skip_smoke }}" = "true" ]; then
            smoke_outcome="skipped"
          fi
          pre_id="$PREVIOUS_TRAFFIC"
          if [ -z "$pre_id" ]; then
            pre_id="(none — first deploy on this env)"
          fi
          echo "## Deploy result" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: \`${{ inputs.environment }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Previous traffic: \`$pre_id\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployed version_id: \`${{ steps.deploy.outputs.new_version_id || 'failed-before-deploy' }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smoke: $smoke_outcome" >> "$GITHUB_STEP_SUMMARY"
          if [ "$smoke_outcome" = "failure" ] && [ "${{ inputs.skip_rollback }}" = "false" ]; then
            echo "- Auto-rollback: ${{ steps.rollback.outcome || 'skipped' }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail the workflow if smoke failed
        if: ${{ inputs.skip_smoke == false && steps.smoke.outcome == 'failure' }}
        run: |
          echo "Smoke failed — see previous steps. Workflow marked failed."
          exit 1
