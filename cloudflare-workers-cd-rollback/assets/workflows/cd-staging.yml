name: CD staging

# Auto-deploy every merge to main to staging. The reusable deploy.yml
# applies migrations, builds, deploys, runs smoke, and auto-rolls-back
# on smoke failure.
#
# Path filter: only run when changes can affect the worker. Docs-only
# commits skip the deploy cycle.

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "db/**"
      - "scripts/**"
      - ".github/workflows/cd-staging.yml"
      - ".github/workflows/deploy.yml"
      - "cloudflare.config.ts"
      - "vite.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "moon.mod"
      - "moon.mod.json"

permissions:
  contents: read

jobs:
  # Skip until the repository has both Cloudflare credentials. A precheck
  # exposes readiness as a job output because job-level if cannot read secrets.
  precheck:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable staging CD."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: precheck
    if: needs.precheck.outputs.ready == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      # Avoid passing `github.event.head_commit.message` here — commit
      # bodies contain newlines and YAML-interpolating them into a
      # shell string is unsafe (one repro leaked the words `--yes` and
      # `cf` from a commit body into a shell command). The sha
      # is enough; the deploy step adds a short sha already.
      message: "cd-staging ${{ github.sha }}"
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      CF_ACCESS_CLIENT_ID_STAGING: ${{ secrets.CF_ACCESS_CLIENT_ID_STAGING }}
      CF_ACCESS_CLIENT_SECRET_STAGING: ${{ secrets.CF_ACCESS_CLIENT_SECRET_STAGING }}
