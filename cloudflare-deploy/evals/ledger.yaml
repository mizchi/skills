failure_patterns:
- name: Dry-run mistaken for secret completeness
  issue: Secret file omitted but cf RC.1 prebuilt deploy dry-run still exits zero.
  general_fix_rule: State separately which input is declared, which values are locally
    checked, and which remote behavior remains unverified.
  seen_in:
  - 1
- name: Documented checker scope exceeds implemented assertions
  issue: FFI reference promised unresolved runtime reference detection absent from
    bundle checker.
  general_fix_rule: Describe only implemented assertions and identify the extra runtime
    test needed for broader guarantees.
  seen_in:
  - 1
- name: Partial numeric error-code match permits unintended fallback
  issue: 100070 matched 10007 and allowed deployment after a listing failure.
  general_fix_rule: Match diagnostic codes as complete tokens and exercise adjacent
    invalid codes in the real consumer.
  seen_in:
  - 1
