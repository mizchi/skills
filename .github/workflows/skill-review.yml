name: Skill semantic review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '*/**'
      - '.jev-lint.yaml'
      - '.jev-lint/**'
      - '.github/workflows/skill-review.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - '*/**'
      - '.jev-lint.yaml'
      - '.jev-lint/**'
      - '.github/workflows/skill-review.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # PRs use base tools/configuration. Proposed blobs are read as data only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test review selection and evidence contracts
        run: pnpm test:skill-review
      - name: Plan changed skill text and translation pairs
        run: pnpm review:skills --event-file "$GITHUB_EVENT_PATH" --dry-run
      - name: Review proposed skill text with trusted tooling
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: pnpm review:skills --event-file "$GITHUB_EVENT_PATH"
      - name: Upload selection, plans and semantic records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-review-${{ github.run_id }}
          path: .cache/skill-review/current/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
