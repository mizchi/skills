name: Skill semantic review

on:
  # pull_request, not pull_request_target: fork PRs get no secrets, so they
  # cannot spend TYPESAFE_API_KEY. Same-repo PRs run their own review tooling.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '*/**'
      - '.jev-lint.yaml'
      - '.jev-lint/**'
      - '.github/workflows/skill-review.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [main]
    paths:
      - '*/**'
      - '.jev-lint.yaml'
      - '.jev-lint/**'
      - '.github/workflows/skill-review.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Proposed skill text is read with `git show` as data, never executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test review selection and evidence contracts
        run: pnpm test:skill-review
      - name: Plan changed skill text and translation pairs
        run: pnpm review:skills --event-file "$GITHUB_EVENT_PATH" --dry-run
      - name: Fork pull request - semantic review skipped
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "::notice::Fork pull requests get no secrets; the semantic review runs after merge or by workflow_dispatch."
      - name: Review proposed skill text
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: pnpm review:skills --event-file "$GITHUB_EVENT_PATH"
      - name: Upload selection, plans and semantic records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-review-${{ github.run_id }}
          path: .cache/skill-review/current/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
