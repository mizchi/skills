name: markdown-links

on:
  push:
    paths:
      - "**/*.md"
      - "**/*.markdown"
      - "**/*.mdx"
      - "scripts/*lychee*"
      - "scripts/*markdown-links*"
      - "lychee.toml"
      - "markdown-links.justfile"
      - ".github/workflows/markdown-links.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.markdown"
      - "**/*.mdx"
      - "scripts/*lychee*"
      - "scripts/*markdown-links*"
      - "lychee.toml"
      - "markdown-links.justfile"
      - ".github/workflows/markdown-links.yml"
  schedule:
    - cron: "17 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markdown-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install checksum-pinned lychee
        run: node scripts/install-lychee.mjs
      - name: Test scope and real link detection
        run: node --test scripts/markdown-links_test.mjs
      - name: Check local files and Markdown fragments
        run: node scripts/check-markdown-links.mjs
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: markdown-local-links
          path: .cache/markdown-links/local.json
          include-hidden-files: true
          if-no-files-found: ignore

  external:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install checksum-pinned lychee
        run: node scripts/install-lychee.mjs
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .lycheecache
          key: markdown-links-${{ runner.os }}-0.24.2-${{ github.run_id }}
          restore-keys: markdown-links-${{ runner.os }}-0.24.2-
      - name: Check HTTP(S) links
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-markdown-links.mjs --online
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: markdown-external-links
          path: .cache/markdown-links/online.json
          include-hidden-files: true
          if-no-files-found: ignore
