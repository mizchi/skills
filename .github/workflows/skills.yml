name: skills

on:
  push:
    paths:
      - ".github/workflows/skills.yml"
      - "**/SKILL.md"
      - "**/SKILL-ja.md"
      - "**/README.md"
      - "**/evals/**"
      - "scripts/**"
      - "Taskfile.pkl"
      - "cloudflare.justfile"
      - "cloudflare-*/**"
      - "utels-project-bootstrap/**"
  pull_request:
    paths:
      - ".github/workflows/skills.yml"
      - "**/SKILL.md"
      - "**/SKILL-ja.md"
      - "**/README.md"
      - "**/evals/**"
      - "scripts/**"
      - "Taskfile.pkl"
      - "cloudflare.justfile"
      - "cloudflare-*/**"
      - "utels-project-bootstrap/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Show Ruby version
        run: ruby --version
      - name: Test frontmatter validator
        run: ruby scripts/validate-skill-frontmatter_test.rb
      - name: Validate SKILL.md frontmatter
        run: ruby scripts/validate-skill-frontmatter.rb
      - name: Check generated README files
        run: ruby scripts/gen-skill-readme.rb --check
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test cf deployment and secret helpers
        run: node --test cloudflare-workers-cd-rollback/assets/scripts/deployment-state.test.ts utels-project-bootstrap/assets/scripts/setup-utels.test.ts cloudflare-mbt-worker-bundle/assets/scripts/check-worker-bundle.test.ts
