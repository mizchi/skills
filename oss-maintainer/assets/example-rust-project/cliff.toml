# git-cliff configuration: generate CHANGELOG.md from Conventional Commits.
# https://git-cliff.org/docs/configuration
#
# The GitHub owner and repository are read from the `origin` remote. Set
# GITHUB_TOKEN (for example `GITHUB_TOKEN=$(gh auth token)`) so the author and
# pull request of each commit can be looked up without hitting the rate limit.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. This file is generated by [git-cliff](https://git-cliff.org) from Conventional Commits. Edit commit messages or cliff.toml, not this file.
"""
# Credit everyone except the repository owner and bots. For a repository owned
# by an organization, replace `remote.github.owner` with a list of maintainers.
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}
{%- macro credit(username) -%}
  {%- if username and username != remote.github.owner and not username is ending_with("[bot]") %} by @{{ username }}{% endif -%}
{%- endmacro -%}
{%- macro newcomers() -%}
  {%- if github.contributors is defined -%}
  {%- for contributor in github.contributors | filter(attribute="is_first_time", value=true) -%}
    {%- if contributor.username and contributor.username != remote.github.owner and not contributor.username is ending_with("[bot]") %}
- @{{ contributor.username }} made their first contribution{% if contributor.pr_number %} in [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}){% endif %}
    {%- endif -%}
  {%- endfor -%}
  {%- endif -%}
{%- endmacro %}
{% if version -%}
  ## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{%- else -%}
  ## Unreleased
{%- endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}**BREAKING** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
  {% if commit.remote.pr_number and not commit.message is containing("#" ~ commit.remote.pr_number) %} ([#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }})){% endif %}\
  {{ self::credit(username=commit.remote.username | default(value="")) }}
{%- endfor %}
{% endfor %}
{%- set newcomers = self::newcomers() -%}
{%- if newcomers | trim | length != 0 %}
### New Contributors
{{ newcomers }}
{% endif -%}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
tag_pattern = "^v[0-9]"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Changed" },
  { message = "^revert", group = "<!-- 3 -->Reverted" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^chore\\(release\\)|^chore: release", skip = true },
  { message = ".*", skip = true },
]
